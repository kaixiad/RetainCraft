name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 描述你遇到的问题或痛点
      placeholder: 我在使用时遇到的问题是...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的解决方案
      placeholder: 我希望...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的其他替代方案
      placeholder: 也可以考虑...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 额外上下文
      description: 补充其他相关信息（截图、日志等）
      placeholder: 其他信息...
    validations:
      required: false
